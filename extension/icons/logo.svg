<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="45%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Golden Frame Gradient -->
    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#b45309" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Inner Core Amber Radial Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#ea580c" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Scimitar Steel Gradient -->
    <linearGradient id="scimitarSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Blade Edge Golden Light -->
    <linearGradient id="bladeEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Shard / Voxel Gradient -->
    <linearGradient id="shardAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Neon Cyan Code Disruption Gradient -->
    <linearGradient id="cyanSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <!-- Filter for Luminous Aura -->
    <filter id="bladeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Hexagonal/Diamond Combat Shield -->
  <polygon points="256,18 474,96 474,342 256,494 38,342 38,96" 
           fill="url(#shieldBg)" 
           stroke="url(#goldFrame)" 
           stroke-width="10" 
           stroke-linejoin="round" />

  <!-- Inner Inset Shield Line -->
  <polygon points="256,36 454,108 454,330 256,470 58,330 58,108" 
           fill="none" 
           stroke="#f59e0b" 
           stroke-opacity="0.25" 
           stroke-width="2.5" 
           stroke-linejoin="round" />

  <!-- Ambient Glow Behind Warrior -->
  <circle cx="256" cy="260" r="160" fill="url(#coreGlow)" />

  <!-- 2. Demolished Web Code & Grid Elements (Shattered Voxels in the Background) -->
  <!-- Left Side Floating / Shattered Web Brackets & Voxels -->
  <g fill="#f59e0b" opacity="0.85">
    <!-- Exploding 3D Voxel Cubes (Left) -->
    <!-- Cube A -->
    <polygon points="105,170 125,158 145,170 125,182" fill="#fde047" />
    <polygon points="105,170 125,182 125,204 105,192" fill="#d97706" />
    <polygon points="145,170 125,182 125,204 145,192" fill="#92400e" />

    <!-- Cube B (Higher) -->
    <polygon points="80,120 96,110 112,120 96,130" fill="#fef08a" />
    <polygon points="80,120 96,130 96,146 80,136" fill="#f59e0b" />
    <polygon points="112,120 96,130 96,146 112,136" fill="#b45309" />

    <!-- Cube C (Lower Debris) -->
    <polygon points="118,360 134,350 150,360 134,370" fill="#fde047" />
    <polygon points="118,360 134,370 134,386 118,376" fill="#d97706" />
    <polygon points="150,360 134,370 134,386 150,376" fill="#78350f" />

    <!-- Small Debris Pixels -->
    <rect x="75" y="220" width="10" height="10" fill="#fbbf24" rx="2" />
    <rect x="95" y="270" width="14" height="14" fill="#f59e0b" rx="2" />
    <rect x="135" y="240" width="8" height="8" fill="#fde047" rx="1" />
    <rect x="90" y="320" width="12" height="12" fill="#ea580c" rx="2" />
  </g>

  <!-- Right Side Exploding Voxel Cubes & Digital Code Shards -->
  <g fill="#06b6d4" opacity="0.85">
    <!-- Cyan Shattered Web Voxel (Right) -->
    <polygon points="370,140 390,128 410,140 390,152" fill="#a5f3fc" />
    <polygon points="370,140 390,152 390,174 370,162" fill="#06b6d4" />
    <polygon points="410,140 390,152 390,174 410,162" fill="#0e7490" />

    <!-- Amber Cube Right -->
    <polygon points="395,310 415,298 435,310 415,322" fill="#fde047" />
    <polygon points="395,310 415,322 415,344 395,332" fill="#f59e0b" />
    <polygon points="435,310 415,322 415,344 435,332" fill="#92400e" />

    <!-- Small Right Particles -->
    <rect x="420" y="210" width="12" height="12" fill="#38bdf8" rx="2" />
    <rect x="365" y="260" width="8" height="8" fill="#fbbf24" rx="1" />
    <rect x="425" y="250" width="14" height="14" fill="#f59e0b" rx="2" />
    <rect x="375" y="365" width="10" height="10" fill="#fde047" rx="2" />
  </g>

  <!-- Shattered HTML Code Tags "< / >" Behind Knight -->
  <!-- Left Bracket '<' -->
  <path d="M165,190 L120,235 L165,280" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" />
  <!-- Right Bracket '>' -->
  <path d="M347,190 L392,235 L347,280" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" />

  <!-- 3. The Knight's Historic Arab Armor & Visor (جَحْدَر الفارس المغوار) -->
  <g>
    <!-- Helmet Dome (قبة الخوذة الفولاذية الموشحة بالذهب) -->
    <path d="M190,210 C190,135 230,95 256,70 C282,95 322,135 322,210 C322,235 315,250 310,260 L202,260 C197,250 190,235 190,210 Z" 
          fill="url(#scimitarSteel)" 
          stroke="url(#goldFrame)" 
          stroke-width="5" />

    <!-- Helmet Top Spike (سندان / سنان الخوذة الذهبي) -->
    <polygon points="256,48 263,78 249,78" fill="url(#goldFrame)" />
    <circle cx="256" cy="46" r="5" fill="#fef08a" />

    <!-- Helmet Golden Nasal Guard & Brow Inlay -->
    <path d="M202,185 L256,165 L310,185 L300,205 L256,192 L212,205 Z" 
          fill="url(#goldFrame)" />

    <!-- Warrior Slit Visor (فتحة بصر الفارس المتوهجة بالشجاعة) -->
    <path d="M216,215 L250,222 L250,232 L218,228 Z" fill="#fef08a" filter="url(#bladeGlow)" />
    <path d="M296,215 L262,222 L262,232 L294,228 Z" fill="#fef08a" filter="url(#bladeGlow)" />

    <!-- Cheek & Jaw Guard (واقية الفك والصفائح) -->
    <polygon points="202,260 215,310 256,335 297,310 310,260 285,275 256,285 227,275" 
             fill="#0f172a" 
             stroke="url(#goldFrame)" 
             stroke-width="4" />

    <!-- Neck Gorget & Chestplate (درع الصدر المصفح) -->
    <path d="M165,340 L256,380 L347,340 L360,400 L256,445 L152,400 Z" 
          fill="#1e293b" 
          stroke="url(#goldFrame)" 
          stroke-width="4" />

    <!-- Golden Emblem on Chest: Stylized Arabic Letter "ج" for Jahdar -->
    <path d="M240,392 C240,380 256,378 266,382 C276,386 280,396 274,406 C266,420 242,422 236,410 C234,406 235,404 238,404 C241,404 242,408 248,411 C254,414 263,411 266,403 C268,397 265,392 258,390 C252,388 245,390 245,394 Z" 
          fill="url(#goldFrame)" />
    <circle cx="256" cy="402" r="3" fill="#fde047" />
  </g>

  <!-- 4. The Giant-Cleaving Arab Scimitar (سيف جحدر الصارم قاهر العمالقة) -->
  <!-- Diagonal Powerful Scimitar cutting across the emblem -->
  <g filter="url(#bladeGlow)">
    <!-- Scimitar Curved Blade -->
    <path d="M130,420 C180,360 270,220 380,100 C375,120 370,150 330,220 C270,330 200,410 148,432 Z" 
          fill="url(#scimitarSteel)" 
          stroke="url(#goldFrame)" 
          stroke-width="3.5" />

    <!-- Sharp Glowing Edge of the Sword -->
    <path d="M130,420 C180,360 270,220 380,100" 
          fill="none" 
          stroke="url(#bladeEdge)" 
          stroke-width="4.5" 
          stroke-linecap="round" />

    <!-- Sword Hilt & Pommel (مقبض السيف المذهب) -->
    <!-- Guard -->
    <path d="M120,410 L155,445 L144,456 L109,421 Z" fill="url(#goldFrame)" />
    <!-- Grip -->
    <path d="M125,435 L102,460" stroke="#78350f" stroke-width="9" stroke-linecap="round" />
    <path d="M125,435 L102,460" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 3" />
    <!-- Pommel (رمانة السيف) -->
    <circle cx="98" cy="465" r="7.5" fill="url(#goldFrame)" stroke="#fef08a" stroke-width="1.5" />
  </g>

  <!-- 5. Demolition Impact Flare at the Blade Tip (شرارة شق الموقع) -->
  <g transform="translate(380, 100)">
    <circle cx="0" cy="0" r="16" fill="#fef08a" opacity="0.9" filter="url(#bladeGlow)" />
    <polygon points="-4,-28 4,-28 1,28 -1,28" fill="#fff" />
    <polygon points="-28,-4 28,-1 28,1 -28,4" fill="#fff" />
    <circle cx="0" cy="0" r="6" fill="#fff" />
  </g>

  <!-- 6. Bottom Banner / Title Ribbon: "جَحْدَر // JAHDAR" -->
  <g transform="translate(0, 10)">
    <!-- Banner Plate -->
    <polygon points="120,442 392,442 372,482 140,482" 
             fill="#030712" 
             stroke="url(#goldFrame)" 
             stroke-width="3.5" />

    <!-- Arabic Title text: جَحْدَر -->
    <text x="256" y="470" 
          font-family="'Segoe UI', Tahoma, Arial, sans-serif" 
          font-size="24" 
          font-weight="900" 
          fill="#fef08a" 
          text-anchor="middle" 
          letter-spacing="3">
      جَحْدَر • JAHDAR
    </text>
  </g>
</svg>
