<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>جَحْدَر — قاهر عمالقة الويب</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #111827;
      --border: #1f293d;
      --gold: #f59e0b;
      --gold-light: #fef08a;
      --gold-dark: #b45309;
      --cyan: #38bdf8;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", "Tahoma", sans-serif;
      user-select: none;
    }

    body {
      width: 330px;
      background: var(--bg);
      color: var(--text);
      padding: 18px;
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .logo-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: radial-gradient(circle, #1e293b 0%, #0b0f19 100%);
      border: 1px solid var(--gold);
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .logo-box img {
      width: 32px;
      height: 32px;
    }

    .header-text h1 {
      font-size: 17px;
      font-weight: 800;
      color: var(--gold-light);
      letter-spacing: -0.3px;
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
      line-height: 1.2;
    }

    .header-text p {
      font-size: 11px;
      color: var(--cyan);
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .site-card {
      background: rgba(17, 24, 39, 0.8);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .site-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      flex-shrink: 0;
    }

    .site-name {
      font-size: 12px;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      direction: ltr;
      text-align: right;
      flex: 1;
      font-family: monospace;
    }

    .launch-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 60%, #b45309 100%);
      color: #0b0f19;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 18px rgba(245, 158, 11, 0.45);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      margin-bottom: 16px;
    }

    .launch-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(245, 158, 11, 0.65);
      filter: brightness(1.08);
    }

    .launch-btn:active {
      transform: translateY(1px);
    }

    .hotkey-tag {
      font-size: 11px;
      background: rgba(0, 0, 0, 0.25);
      padding: 2px 7px;
      border-radius: 6px;
      color: #fff;
      font-weight: 600;
      font-family: monospace;
    }

    .instructions {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 12px;
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 14px;
    }

    .instructions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 6px;
    }

    .key-badge {
      display: inline-block;
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--gold-light);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10.5px;
      font-family: monospace;
      font-weight: 700;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10.5px;
      color: #64748b;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .footer a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    .footer a:hover {
      color: var(--gold-light);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-box">
      <img src="icons/icon-48.png" alt="جحدر" />
    </div>
    <div class="header-text">
      <h1>جَحْدَر</h1>
      <p>قاهر عمالقة الويب // v1.0</p>
    </div>
  </div>

  <div class="site-card">
    <div class="site-dot"></div>
    <span class="site-name" id="tabDomain">جاري فحص الصفحة...</span>
  </div>

  <button class="launch-btn" id="launchBtn">
    <span>⚔️ ابدأ النسف الفيزيائي</span>
    <span class="hotkey-tag">Alt+Shift+J</span>
  </button>

  <div class="instructions">
    <strong style="color: var(--text);">تحكم المعركة:</strong>
    <div class="instructions-grid">
      <div><span class="key-badge">WASD</span> تحرك وقفز</div>
      <div><span class="key-badge">الفأرة</span> تصويب ونار</div>
      <div><span class="key-badge">1 - 0</span> اختيار السلاح</div>
      <div><span class="key-badge">Right Click</span> قنبلة</div>
      <div><span class="key-badge">H</span> تصوير تذكاري</div>
      <div><span class="key-badge">Esc</span> خروج فوري</div>
    </div>
  </div>

  <div class="footer">
    <span>محرك فوكسل تفاعلي 100%</span>
    <a href="https://github.com/bio-colab/WTFunny" target="_blank">المستودع مفتوح المصدر</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
