name: CI & Extension Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    name: Build & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check (TypeScript)
        run: npx tsc --noEmit

      - name: Build Chrome Extension (Manifest V3)
        run: npm run build:extension

      - name: Build Next.js Web Application
        run: npm run build

      - name: Package Extension Distribution
        run: |
          mkdir -p release
          zip -r release/jahdar-extension.zip extension/ -x "extension/src/*" "extension/*.map"

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jahdar-browser-extension
          path: release/jahdar-extension.zip
          retention-days: 30
